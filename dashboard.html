<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOMNI — Financial Intelligence & Middleware Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,500;0,800;1,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* ====== Same as your existing dashboard styles ====== */
    /* (I'll keep them concise; you can reuse your full styles) */
    :root { /* ... your variables ... */ }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; color:#fff; font-family:'Inter',sans-serif; height:100vh; overflow:hidden; display:flex; }
    .app-container { display:flex; width:100vw; height:100vh; }
    /* Sidebar, etc. – keep your existing layout */
    /* ... (paste your full dashboard CSS here) ... */

    /* Welcome Wizard Overlay */
    #welcomeWizard {
      position: fixed; inset:0; z-index:9999;
      display:flex; align-items:center; justify-content:center;
      background: radial-gradient(circle at 50% 50%, #120930 0%, #030308 100%);
      transition: opacity 0.8s ease;
      opacity:0; pointer-events:none;
    }
    #welcomeWizard .wizard-card {
      background: rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:20px; padding:40px 60px; max-width:600px;
      text-align:center; backdrop-filter:blur(10px);
      box-shadow:0 20px 60px rgba(0,0,0,0.8);
      transform:scale(0.9); transition: transform 0.6s cubic-bezier(0.16,1,0.3,1), opacity 0.6s ease;
      opacity:0;
    }
    #welcomeWizard .wizard-card h1 {
      font-family:'Plus Jakarta Sans',sans-serif; font-size:28px; font-weight:800;
      background: linear-gradient(135deg,#6036E1,#D83DC2); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    #welcomeWizard .wizard-card .wizard-key-label { color:#8A8A8A; margin:16px 0 8px; font-size:14px; letter-spacing:1px; text-transform:uppercase; font-weight:600; }
    #welcomeWizard .wizard-card .wizard-key-display {
      font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:600; color:#fff;
      background:rgba(255,255,255,0.05); padding:12px 24px; border-radius:8px;
      border:1px solid rgba(255,255,255,0.1); display:inline-block; margin-bottom:16px;
    }
    #welcomeWizard .wizard-card .wizard-owner { color:#8A8A8A; font-size:13px; }
    #welcomeWizard .wizard-card .wizard-tier { color:#525252; font-size:12px; margin-top:4px; }
    #welcomeWizard .wizard-card .wizard-launch-btn {
      margin-top:28px; background:linear-gradient(135deg,#6036E1,#D83DC2); border:none; color:#fff;
      font-weight:600; padding:12px 32px; border-radius:8px; font-size:14px; cursor:pointer;
      box-shadow:0 0 20px rgba(96,54,225,0.25); transition:all 0.2s ease;
    }
    #welcomeWizard .wizard-card .wizard-launch-btn:hover { box-shadow:0 0 30px rgba(216,61,194,0.4); transform:translateY(-2px); }
  </style>
</head>
<body>

  <!-- Welcome Wizard -->
  <div id="welcomeWizard">
    <div class="wizard-card">
      <h1>Welcome Back</h1>
      <div class="wizard-key-label">Issuance Key</div>
      <div class="wizard-key-display" id="wizardKeyDisplay"></div>
      <div class="wizard-owner" id="wizardOwnerDisplay"></div>
      <div class="wizard-tier" id="wizardTierDisplay"></div>
      <button class="wizard-launch-btn" onclick="dismissWizard()">Launch Dashboard</button>
    </div>
  </div>

  <!-- Your existing dashboard layout -->
  <div class="app-container">
    <!-- ... sidebar, main content ... -->
    <!-- Keep your existing dashboard HTML exactly as before -->
    <!-- (I'm omitting it here for brevity – you'll paste it) -->
  </div>

  <script>
    // ========== FIREBASE CONFIG (same as login) ==========
    const firebaseConfig = {
      apiKey: "AIzaSyAFWiEwg5Ouhs2UZlWmGphpaLvPkrE6eD4",
      authDomain: "komni-2439f.firebaseapp.com",
      projectId: "komni-2439f",
      storageBucket: "komni-2439f.firebasestorage.app",
      messagingSenderId: "1005791374529",
      appId: "1:1005791374529:web:e1735b735f4c8c420eb840",
      measurementId: "G-SKLPK0NHFZ"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ========== WELCOME WIZARD LOGIC ==========
    async function showWelcomeWizard() {
      const key = localStorage.getItem('komni_issuance_key');
      if (!key) {
        window.location.href = 'login.html';
        return;
      }

      const wizard = document.getElementById('welcomeWizard');
      const keyDisplay = document.getElementById('wizardKeyDisplay');
      const ownerDisplay = document.getElementById('wizardOwnerDisplay');
      const tierDisplay = document.getElementById('wizardTierDisplay');

      let userData = null;
      try {
        const doc = await db.collection('users').doc(key).get();
        if (doc.exists) {
          userData = doc.data();
          localStorage.setItem('komni_user_metadata', JSON.stringify(userData));
        }
      } catch (e) {
        console.warn('Firestore fetch failed, using localStorage', e);
      }

      if (!userData) {
        const stored = localStorage.getItem('komni_user_metadata');
        if (stored) userData = JSON.parse(stored);
      }

      if (!userData) {
        window.location.href = 'login.html';
        return;
      }

      keyDisplay.textContent = key;
      ownerDisplay.textContent = `Owner: ${userData.owner || '—'}`;
      tierDisplay.textContent = `Tier: ${userData.tier || '—'}`;

      const card = wizard.querySelector('.wizard-card');
      wizard.style.opacity = '1';
      wizard.style.pointerEvents = 'auto';
      requestAnimationFrame(() => {
        card.style.opacity = '1';
        card.style.transform = 'scale(1)';
      });
    }

    function dismissWizard() {
      const wizard = document.getElementById('welcomeWizard');
      const card = wizard.querySelector('.wizard-card');
      card.style.opacity = '0';
      card.style.transform = 'scale(0.9)';
      wizard.style.opacity = '0';
      wizard.style.pointerEvents = 'none';
    }

    // ========== YOUR EXISTING TELEMETRY CODE ==========
    // (keep your fetchTelemetry, chart, etc. – unchanged)
    // Just ensure it starts after the wizard is shown.

    document.addEventListener('DOMContentLoaded', async () => {
      await showWelcomeWizard();
      // Start your telemetry polling here
      // fetchTelemetry(); setInterval(fetchTelemetry, 3000);
    });
  </script>
</body>
</html>
