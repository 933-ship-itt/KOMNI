<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOMNI — Premium Access Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      max-width: 400px;
      width: 100%;
      padding: 40px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #6036E1, #D83DC2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo p { color: #8A8A8A; font-size: 14px; margin-top: 8px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #8A8A8A; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: rgba(255,255,255,0.2); }
    button {
      width: 100%;
      padding: 14px;
      background: #fff;
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #8A8A8A;
      display: none;
    }
    .status.visible { display: block; }
    .status .success { color: #22c55e; }
    .status .error { color: #ef4444; }
    .status .accent { color: #D83DC2; }
    .retry { margin-top: 12px; display: none; }
    .retry button { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>KOMNI</h1>
      <p>Institutional Sign In</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Enterprise Issuance Key</label>
        <input type="password" id="issuanceKey" placeholder="test or ik_010101" autocomplete="off" required>
      </div>
      <button type="submit" id="authBtn">Authenticate Session</button>
    </form>
    <div class="status" id="status">
      <span id="statusLine1"></span><br>
      <span id="statusLine2"></span><br>
      <span id="statusLine3"></span>
      <div class="retry" id="retryContainer">
        <button onclick="resetLogin()">Try Another Key</button>
      </div>
    </div>
  </div>

  <script>
    // ========== FIREBASE CONFIG ==========
    const firebaseConfig = {
      apiKey: "AIzaSyAFWiEwg5Ouhs2UZlWmGphpaLvPkrE6eD4",
      authDomain: "komni-2439f.firebaseapp.com",
      projectId: "komni-2439f",
      storageBucket: "komni-2439f.firebasestorage.app",
      messagingSenderId: "1005791374529",
      appId: "1:1005791374529:web:e1735b735f4c8c420eb840",
      measurementId: "G-SKLPK0NHFZ"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const VERCEL_BACKEND = 'https://komni-backend.vercel.app/api/verify_key';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawKey = document.getElementById('issuanceKey').value.trim();
      if (!rawKey) return;

      // Normalise
      let formattedKey = rawKey;
      if (rawKey.toLowerCase() === 'test') formattedKey = 'ik_test_demo';
      else if (rawKey.toUpperCase().startsWith('IK-')) formattedKey = 'ik_' + rawKey.substring(3);

      const btn = document.getElementById('authBtn');
      const statusDiv = document.getElementById('status');
      const line1 = document.getElementById('statusLine1');
      const line2 = document.getElementById('statusLine2');
      const line3 = document.getElementById('statusLine3');
      const retry = document.getElementById('retryContainer');

      btn.disabled = true;
      btn.textContent = 'Verifying...';
      statusDiv.classList.add('visible');
      retry.style.display = 'none';
      line1.textContent = `> Initializing for key: ${rawKey}`;
      line1.className = '';
      line2.textContent = '> Contacting Vercel backend...';
      line2.className = 'accent';
      line3.textContent = '';

      try {
        const resp = await fetch(VERCEL_BACKEND, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: formattedKey })
        });
        const data = await resp.json();

        if (resp.ok && data.valid) {
          line2.textContent = '> Signature VERIFIED';
          line2.className = 'success';
          if (data.metadata?.owner) {
            line3.textContent = `> Owner: ${data.metadata.owner}`;
            line3.className = '';
          }

          // Save to Firestore & localStorage
          const userData = {
            owner: data.metadata?.owner || '—',
            tier: data.metadata?.tier || '—',
            key_type: data.metadata?.key_type || '—',
            status: data.metadata?.status || 'active',
            lastLogin: firebase.firestore.FieldValue.serverTimestamp()
          };
          await db.collection('users').doc(formattedKey).set(userData);
          localStorage.setItem('komni_issuance_key', formattedKey);
          localStorage.setItem('komni_user_metadata', JSON.stringify(userData));

          btn.textContent = '✔ Authenticated! Redirecting...';
          btn.style.background = '#22c55e';
          btn.style.color = '#fff';
          btn.disabled = true;

          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1200);

        } else {
          line2.textContent = `> REJECTED: ${data.reason || 'Invalid key'}`;
          line2.className = 'error';
          btn.textContent = 'Retry';
          btn.disabled = false;
          btn.style.background = '#ef4444';
          btn.style.color = '#fff';
          retry.style.display = 'block';
        }
      } catch (err) {
        line2.textContent = '> NETWORK ERROR - check console';
        line2.className = 'error';
        btn.textContent = 'Retry';
        btn.disabled = false;
        btn.style.background = '#ef4444';
        btn.style.color = '#fff';
        retry.style.display = 'block';
        console.error(err);
      }
    });

    function resetLogin() {
      const btn = document.getElementById('authBtn');
      btn.disabled = false;
      btn.textContent = 'Authenticate Session';
      btn.style.background = '#fff';
      btn.style.color = '#000';
      document.getElementById('status').classList.remove('visible');
      document.getElementById('issuanceKey').value = '';
      document.getElementById('issuanceKey').focus();
    }
  </script>
</body>
</html>
