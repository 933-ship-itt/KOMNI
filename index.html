<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KOMNI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    background:#000;
    color:white;

    font-family:Inter,sans-serif;

    overflow-x:hidden;

}

/* ---------------- NAVBAR ---------------- */

nav{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 70px;

    z-index:100;

    background:rgba(0,0,0,.88);

    backdrop-filter:blur(18px);

}

.logo{

    font-size:34px;

    font-weight:800;

    letter-spacing:8px;

    background:linear-gradient(to right,#6036E1,#D83DC2);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    opacity:0;

    transform:translateY(50px) scale(.9);

    animation:logoReveal 2s cubic-bezier(.16,1,.3,1) forwards;

}

/* ---------------- HERO ---------------- */

.hero{

    min-height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    text-align:center;

    padding:120px 30px;

}

.hero h1{

    font-size:82px;

    font-weight:800;

    line-height:1;

    letter-spacing:-3px;

    max-width:1100px;

    opacity:0;

    transform:translateY(70px);

    animation:fadeUp 1.8s .8s forwards;

}

.hero p{

    margin-top:35px;

    color:#8d8d8d;

    font-size:20px;

    line-height:1.8;

    max-width:760px;

    opacity:0;

    transform:translateY(40px);

    animation:fadeUp 1.6s 1.4s forwards;

}

/* ---------------- Divider ---------------- */

.line{

    width:1px;

    height:140px;

    background:#222;

    margin-top:90px;

    opacity:0;

    animation:fadeIn 1s 2.2s forwards;

}

/* ---------------- Scroll Indicator ---------------- */

.scroll{

    margin-top:35px;

    color:#555;

    letter-spacing:5px;

    font-size:12px;

    opacity:0;

    animation:fadeIn 1s 2.5s forwards;

}

/* ---------------- Animations ---------------- */

@keyframes logoReveal{

    0%{

        opacity:0;

        transform:
        translateY(50px)
        scale(.92);

        filter:blur(12px);

    }

    55%{

        opacity:1;

    }

    100%{

        opacity:1;

        transform:
        translateY(0)
        scale(1);

        filter:blur(0);

    }

}

@keyframes fadeUp{

    to{

        opacity:1;

        transform:translateY(0);

    }

}

@keyframes fadeIn{

    to{

        opacity:1;

    }

}

/* ---------------- Responsive ---------------- */

@media(max-width:900px){

.hero h1{

    font-size:54px;

}

.logo{

    font-size:28px;

}

nav{

    padding:0 30px;

}

.hero p{

    font-size:18px;

}

}

</style>

</head>

<body>

<nav>

<div class="logo">

KOMNI

</div>

</nav>

<section class="hero">

<h1>

Enterprise Intelligence.<br>
Reimagined.

</h1>

<p>

The next generation of enterprise financial infrastructure built around trust,
security, operational resilience, and intelligent payment orchestration.

</p>

<div class="line"></div>

<div class="scroll">

SCROLL

</div>

</section>

</body>

</html>
