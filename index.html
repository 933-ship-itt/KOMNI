<html lang="en">

  <title>KOMNI — Self-Orchestrating Infrastructure for Enterprise Financial Continuity</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* ==========================================================================
       1. SYSTEM VARIABLES & BASE STYLES
       ========================================================================== */
    :root {
      --bg-color: #000000;
      --text-primary: #FFFFFF;
      --text-secondary: #8A8A8A;
      --text-muted: #525252;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.18);
      
      --logo-gradient: linear-gradient(to right, #6036E1, #D83DC2);
      --tagline-gradient: linear-gradient(135deg, #5A8CFF, #AEE7FF);
      
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --ease-expensive: cubic-bezier(0.16, 1, 0.3, 1);

      /* Advert & Login Variables */
      --bg-black: #030308;
      --panel-bg: rgba(8, 8, 12, 0.75);
      --main-gradient: linear-gradient(135deg, #6036E1 0%, #a83ac8 50%, #D83DC2 100%);
      --accent-violet: #6036E1;
      --accent-magenta: #D83DC2;
      --text-sub: #a1a1aa;
      --blue-custom-gradient: linear-gradient(to bottom, #3F6D9F 0%, #5E92CE 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scrollbar-width: thin;
      scrollbar-color: #6036E1 #000000;
    }

    /* Style all webkit scrollbars with pink-purple gradient */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: #000000;
      border-left: 1px solid rgba(255, 255, 255, 0.03);
      border-right: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #6036E1 0%, #D83DC2 100%);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #744beb 0%, #e258cf 100%);
    }

    html, body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-main);
      overflow-x: hidden;
      width: 100%;
    }

    /* ==========================================================================
       2. FIXED BACKGROUND LOGO (DIM HEARTBEAT PULSE)
       ========================================================================== */
    .bg-heartbeat-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0);
      width: clamp(280px, 45vw, 600px);
      height: clamp(280px, 45vw, 600px);
      z-index: 1;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg-heartbeat-logo {
      width: 100%;
      height: auto;
      object-fit: contain;
      opacity: 0.08;
      filter: drop-shadow(0 0 20px rgba(96, 54, 225, 0.35));
      animation: komni-heartbeat 4.5s ease-in-out infinite;
      will-change: transform, opacity;
    }

    @keyframes komni-heartbeat {
      0%, 70%, 100% {
        transform: scale(1) translateZ(0);
        opacity: 0.06;
      }
      14% {
        transform: scale(1.03) translateZ(0);
        opacity: 0.11;
      }
      28% {
        transform: scale(1.01) translateZ(0);
        opacity: 0.08;
      }
      42% {
        transform: scale(1.04) translateZ(0);
        opacity: 0.13;
      }
    }

    /* ==========================================================================
       3. HERO BRANDING STAGE
       ========================================================================== */
    .intro-stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .brand-logo {
      font-size: clamp(68px, 10vw, 130px);
      font-weight: 800;
      letter-spacing: clamp(6px, 1.2vw, 12px);
      line-height: 1;
      background: var(--logo-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      filter: blur(24px);
      transform: scale(0.95);
      transition: opacity 1.6s var(--ease-expensive), filter 1.6s var(--ease-expensive), transform 1.6s var(--ease-expensive);
      user-select: none;
    }

    .brand-logo.is-visible {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1);
    }

    .brand-tagline {
      margin-top: 28px;
      font-size: clamp(11px, 1.2vw, 15px);
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-align: center;
      padding: 0 20px;
      background: var(--tagline-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.2s var(--ease-expensive), transform 1.2s var(--ease-expensive);
      user-select: none;
    }

    .brand-tagline.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .scroll-hint {
      position: absolute;
      bottom: 40px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 1s var(--ease-expensive);
    }

    .scroll-hint.is-visible {
      opacity: 1;
    }

    /* ==========================================================================
       4. ENTERPRISE LANDING PAGE CONTENT
       ========================================================================== */
    .site-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 60px;
      z-index: 200;
      border-bottom: 1px solid var(--border-subtle);
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(-20px) translateZ(0);
      transition: opacity 0.8s var(--ease-expensive), transform 0.8s var(--ease-expensive);
      will-change: transform, opacity;
    }

    body.has-scrolled nav {
      opacity: 1;
      transform: translateY(0) translateZ(0);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 3px;
      color: var(--text-primary);
    }

    .nav-brand img {
      height: 24px;
      width: auto;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 40px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.5px;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .nav-premium-btn {
      background: var(--logo-gradient);
      padding: 8px 18px !important;
      border-radius: 8px;
      color: var(--text-primary) !important;
      font-weight: 600 !important;
      transition: transform 0.3s var(--ease-expensive), box-shadow 0.3s var(--ease-expensive) !important;
      box-shadow: 0 0 15px rgba(96, 54, 225, 0.4);
    }

    .nav-premium-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(216, 61, 194, 0.6);
    }

    main {
      flex: 1;
      padding-top: 100vh;
      padding-bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-content {
      max-width: 900px;
      width: 90%;
      text-align: center;
      margin-bottom: 220px;
    }

  </style>
</head>
<body>
  <!-- The rest of the index page markup remains unchanged. We append a small routing script that:
       - removes/hides any inline login UI if present
       - routes login triggers/buttons to login.html
  -->

  <!-- Place this script near the end of the body so it can find elements created by other scripts -->
  <script>
    (function() {
      const LOGIN_URL = 'login.html';

      // Hide/remove common inline login containers if present
      const selectorsToRemove = [
        '#login', '#loginModal', '#authModal', '#signin', '#sign-in', '.login-modal', '.auth-modal', '.signin-modal', '[data-auth-modal]'
      ];
      selectorsToRemove.forEach(sel => {
        try {
          const el = document.querySelector(sel);
          if (el) el.remove();
        } catch (e) { /* ignore */ }
      });

      // Override common login-opening functions to redirect to login.html
      const functionNames = ['openLogin','showLogin','openAuthModal','showAuth','openSignin','showSignin','openSignIn','showSignIn'];
      functionNames.forEach(name => {
        try {
          Object.defineProperty(window, name, {
            configurable: true,
            writable: true,
            value: function() { window.location.href = LOGIN_URL; }
          });
        } catch (e) { /* ignore */ }
      });

      // Convert any existing login buttons/links to point to login.html
      function rewriteLoginElements(root = document) {
        const linkSelectors = [
          'a[href*="login"]',
          'a[href="#login"]',
          'button[class*="login"]',
          'button[class*="signin"]',
          'button[data-login]',
          '[data-login]',
          '[data-auth]'
        ];
        try {
          const nodes = root.querySelectorAll(linkSelectors.join(','));
          nodes.forEach(el => {
            try {
              if (el.tagName.toLowerCase() === 'a') {
                el.setAttribute('href', LOGIN_URL);
              } else if (el.tagName.toLowerCase() === 'button' || el.hasAttribute('role')) {
                // make clickable elements navigate to login.html
                el.addEventListener('click', function(e){ e.preventDefault(); window.location.href = LOGIN_URL; });
                el.style.cursor = 'pointer';
              }
            } catch (e) {}
          });
        } catch (e) {}
      }

      // Initial rewrite
      rewriteLoginElements(document);

      // Also intercept clicks on any element whose id/class/text suggests it's a login trigger
      document.addEventListener('click', function(e) {
        let el = e.target;
        while (el && el !== document.documentElement) {
          const tag = (el.tagName || '').toLowerCase();
          const cls = (el.className || '').toString().toLowerCase();
          const id = (el.id || '').toLowerCase();
          const href = el.getAttribute && el.getAttribute('href');
          const txt = (el.textContent || '').toLowerCase();

          const isLikelyLogin = (
            el.hasAttribute && (el.hasAttribute('data-login') || el.hasAttribute('data-auth') || el.hasAttribute('data-signin'))
            || (href && href.toLowerCase().includes('login'))
            || cls.includes('login') || cls.includes('signin') || cls.includes('auth')
            || id.includes('login') || id.includes('signin') || id.includes('auth')
            || txt.includes('sign in') || txt.includes('signin') || txt.includes('login')
          );

          if (isLikelyLogin) {
            e.preventDefault();
            window.location.href = LOGIN_URL;
            return;
          }

          el = el.parentElement;
        }
      }, { capture: true });

      // Observe dynamic DOM insertions and rewrite/remove inline login containers or login triggers that appear later
      const observer = new MutationObserver(mutations => {
        for (const m of mutations) {
          for (const node of m.addedNodes || []) {
            if (!(node instanceof HTMLElement)) continue;
            // remove login modal nodes
            selectorsToRemove.forEach(sel => {
              try {
                if (node.matches && node.matches(sel)) node.remove();
                else if (node.querySelector && node.querySelector(sel)) {
                  const found = node.querySelectorAll(sel);
                  found.forEach(n => n.remove());
                }
              } catch (e) {}
            });
            // rewrite any links/buttons under this node
            try { rewriteLoginElements(node); } catch (e) {}
          }
        }
      });
      observer.observe(document.documentElement || document.body, { childList: true, subtree: true });

      // On load, run a final pass
      window.addEventListener('load', function() {
        selectorsToRemove.forEach(sel => {
          try { const el = document.querySelector(sel); if (el) el.remove(); } catch(e){}
        });
        try { rewriteLoginElements(document); } catch(e){}
      }, { once: true });

    })();
  </script>
